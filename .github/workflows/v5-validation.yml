name: V11 Shadowbreak scoring candidate
on:
  push:
    branches: [v11-shadowbreak]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile every module
        run: python3 -m py_compile controller.py arena.py firing.py mechfight.py mobility.py pilot.py storm_tactics.py tactics_v5.py test_v5_policy.py scoremax_v8.py test_scoremax_v8.py test_v8b_npc_integration.py foliage_v9.py test_foliage_v9.py throne_v6.py test_throne_v6.py mechanics_v9.py test_mechanics_v9.py test_v9_integration.py tactical_v10.py test_tactical_v10.py test_v10_integration.py pursuit_v11.py test_pursuit_v11.py test_v11_integration.py v11_replay_diagnostics.py
      - name: Run V5 policy regression tests
        run: python3 -m unittest -v test_v5_policy
      - name: V8B scoremax policy tests
        run: python3 -m unittest -v test_scoremax_v8
      - name: V9 throne geometry tests
        run: python3 -m unittest -v test_throne_v6
      - name: Fetch official starter checker and map
        run: |
          curl --fail --location --retry 3 --output /tmp/mechfight-kit.tar.gz \
            https://www.joinbuilders.org/buildathon/tracks/builders/files/mechfight-kit.tar.gz
          mkdir -p /tmp/mech-kit
          tar -xzf /tmp/mechfight-kit.tar.gz -C /tmp/mech-kit
      - name: Adversarial integration smoke tests with actual map
        run: python3 -m unittest -v test_v5_integration
      - name: V8B scored-baseline integration
        run: python3 -m unittest -v test_v8b_npc_integration
      - name: V9 real foliage geometry and stealth tests
        run: python3 -m unittest -v test_foliage_v9
      - name: V9 exploit mechanics regression tests
        run: python3 -m unittest -v test_mechanics_v9
      - name: V9 actual controller behavioral scenarios
        run: python3 -m unittest -v test_v9_integration
      - name: V10 scoring and projectile physics regressions
        run: python3 -m unittest -v test_tactical_v10
      - name: V10 multi-tick laser and recovery integration
        run: python3 -m unittest -v test_v10_integration
      - name: V11 original map hard-shadow and anti-lead regressions
        run: python3 -m unittest -v test_pursuit_v11
      - name: V11 multi-tick pursuit denial and storm integration
        run: python3 -m unittest -v test_v11_integration
      - name: Replay real recorded attack sequence and report activated policies
        run: python3 v11_replay_diagnostics.py
      - name: Verify protocol and 50ms response budget
        run: |
          python3 /tmp/mech-kit/mechfight-kit/check/check.py \
            --map-dir /tmp/mech-kit/mechfight-kit/arena -- python3 -u controller.py
      - name: Build Docker image
        run: docker build --tag mech-v5-check .
      - name: Match sandbox conformance check
        run: |
          python3 /tmp/mech-kit/mechfight-kit/check/check.py --map-dir /arena -- \
            docker run --rm -i --network none --cpus 1 --memory 512m \
              --read-only --tmpfs /tmp:rw,size=64m --user 65534:65534 \
              -v /tmp/mech-kit/mechfight-kit/arena:/arena:ro mech-v5-check
